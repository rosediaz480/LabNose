<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LabNose Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f1115;
    color: #eaeaea;
    margin: 0;
    padding: 20px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
  }
  h1 { font-weight: 600; margin-bottom: 4px; font-size: 1.6rem; }
  #status { color: #999; margin-bottom: 20px; font-size: 14px; }
  .alert-banner {
    padding: 14px 20px;
    border-radius: 8px;
    font-weight: 600;
    margin-bottom: 20px;
    display: none;
  }
  .alert-OK { background: #1e3a2f; color: #7ee2a8; }
  .alert-VOC_ALERT_2 { background: #4a2412; color: #ff9d5c; }
  .alert-VOC_ALERT_1 { background: #4a1212; color: #ff6b6b; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 30px;
  }
  .card {
    background: #1a1d24;
    border-radius: 10px;
    padding: 16px;
  }
  .card .label { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }

  .charts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
    gap: 24px;
  }
  .chart-box {
    background: #1a1d24;
    border-radius: 10px;
    padding: 16px;
    width: 100%;
    overflow: hidden;
  }
  .chart-box canvas { max-height: 260px; }

  @media (max-width: 600px) {
    body { padding: 14px; }
    h1 { font-size: 1.3rem; }
    #status { font-size: 12px; margin-bottom: 14px; }
    .alert-banner { padding: 12px 14px; font-size: 14px; }
    .cards {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .card { padding: 12px; }
    .card .label { font-size: 11px; }
    .card .value { font-size: 22px; margin-top: 4px; }
    .charts { gap: 16px; }
    .chart-box { padding: 12px; }
    .chart-box canvas { max-height: 200px; }
  }
</style>
</head>
<body>

<h1>Air Quality Dashboard</h1>
<div id="status">Connecting...</div>

<div id="alertBanner" class="alert-banner"></div>

<div class="cards">
  <div class="card"><div class="label">Temperature</div><div class="value" id="v-temp">--</div></div>
  <div class="card"><div class="label">Humidity</div><div class="value" id="v-hum">--</div></div>
  <div class="card"><div class="label">Pressure</div><div class="value" id="v-pres">--</div></div>
  <div class="card"><div class="label">VOC Score</div><div class="value" id="v-iaq">--</div></div>
  <div class="card"><div class="label">MQ135</div><div class="value" id="v-mq">--</div></div>
</div>

<div class="charts">
  <div class="chart-box"><canvas id="chartTemp"></canvas></div>
  <div class="chart-box"><canvas id="chartHum"></canvas></div>
  <div class="chart-box"><canvas id="chartIaq"></canvas></div>
  <div class="chart-box"><canvas id="chartMq"></canvas></div>
</div>

<script>
const alertLabels = {
  "OK": "All Clear",
  "VOC_ALERT_2": "Elevated VOC Detected",
  "VOC_ALERT_1": "Elevated VOC Detected with MQ135"
};

function makeChart(ctx, label, color) {
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: label,
        data: [],
        borderColor: color,
        backgroundColor: color + '33',
        tension: 0.3,
        pointRadius: 0,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      animation: false,
      scales: {
        x: { ticks: { color: '#888', maxTicksLimit: 8 }, grid: { color: '#2a2d34' } },
        y: { ticks: { color: '#888' }, grid: { color: '#2a2d34' } }
      },
      plugins: { legend: { labels: { color: '#ccc' } } }
    }
  });
}

const chartTemp = makeChart(document.getElementById('chartTemp'), 'Temp (F)', '#5c9dff');
const chartHum  = makeChart(document.getElementById('chartHum'), 'Humidity (%)', '#5cd6ff');
const chartIaq  = makeChart(document.getElementById('chartIaq'), 'VOC Score', '#ffbb5c');
const chartMq   = makeChart(document.getElementById('chartMq'), 'MQ135 (V)', '#ff5c8a');

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString();
}

async function refreshLatest() {
  try {
    const res = await fetch('/api/latest');
    const data = await res.json();
    if (!data.timestamp) return;

    document.getElementById('v-temp').textContent = data.temp_f.toFixed(1) + ' F';
    document.getElementById('v-hum').textContent = data.humidity.toFixed(1) + ' %';
    document.getElementById('v-pres').textContent = data.pressure_kpa.toFixed(1) + ' kPa';
    document.getElementById('v-iaq').textContent = data.iaq_score.toFixed(1);
    document.getElementById('v-mq').textContent = data.mq135_voltage.toFixed(2) + ' V';

    const banner = document.getElementById('alertBanner');
    banner.className = 'alert-banner alert-' + data.alert_level;
    banner.style.display = 'block';
    banner.textContent = alertLabels[data.alert_level] || data.alert_level;

    document.getElementById('status').textContent =
      'Last update: ' + fmtTime(data.timestamp);
  } catch (e) {
    document.getElementById('status').textContent = 'Connection lost - retrying...';
  }
}

async function refreshHistory() {
  try {
    const res = await fetch('/api/history');
    const rows = await res.json();
    const labels = rows.map(r => fmtTime(r.timestamp));

    chartTemp.data.labels = labels;
    chartTemp.data.datasets[0].data = rows.map(r => r.temp_f);
    chartTemp.update();

    chartHum.data.labels = labels;
    chartHum.data.datasets[0].data = rows.map(r => r.humidity);
    chartHum.update();

    chartIaq.data.labels = labels;
    chartIaq.data.datasets[0].data = rows.map(r => r.iaq_score);
    chartIaq.update();

    chartMq.data.labels = labels;
    chartMq.data.datasets[0].data = rows.map(r => r.mq135_voltage);
    chartMq.update();
  } catch (e) {
    // ignore, will retry on next tick
  }
}

refreshLatest();
refreshHistory();
setInterval(refreshLatest, 3000);
setInterval(refreshHistory, 15000);
</script>

</body>
</html>
